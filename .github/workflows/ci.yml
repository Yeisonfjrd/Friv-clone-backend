name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Grant execute permission to Maven wrapper
        run: chmod +x mvnw

      - name: Build and test
        run: ./mvnw clean verify

  # Si fallan los tests, ai-fix le pide un arreglo a un modelo local y abre un PR solo si todos pasan.
  # https://github.com/Yeisonfjrd/ai-fix-maven-plugin
  ai-fix:
    needs: build
    if: >-
      failure()
      && !startsWith(github.head_ref || github.ref_name, 'ai-fix/')
      && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: Yeisonfjrd/ai-fix-maven-plugin@v1
